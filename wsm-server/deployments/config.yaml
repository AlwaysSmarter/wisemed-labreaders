# HTTP/WS backend for Nginx. Keep port 8090 on a private network.
server:
  address: "0.0.0.0"
  port: 8090
  control_ui_dir: ../control
  max_message_bytes: 8388608
  allow_insecure_http: true
security:
  audience: wsm-server
  max_token_ttl_seconds: 900
  keys:
    local-backend:
      tenant_id: local
      secret_file: keys/local-backend.key
      roles: [browser, service]
      scopes: ["route:command", "route:reply", "route:event", "route:broadcast", "topics:subscribe", "connections:read", "server:status", "devices:debug", "api:invoke", "api:admin"]
tenants:
  local:
    issuer: https://localhost:8443
    allowed_origins: ["https://localhost:8443"]

# Optional WiseMED administrator console; see docs/admin-console.md.
admin:
  enabled: false
  public_origin: https://ws.example.ro
  session_ttl_seconds: 900
# When enabling, also set security.device_keys_file to a writable persistent path
# such as /var/lib/wsm-server/device-keys.yaml and configure tenant.wisemed HTTPS API.
