# Include inside nginx's http {} block. Replace hostname and TLS file paths.
map $http_upgrade $wsm_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name ws.example.ro;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Avoid logging query credentials or application data.
    access_log off;
    location / {
        # Separate containers on a private network: http://wsm-server:8090
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # Preserve public host INCLUDING port: required by scoped control tickets.
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wsm_connection_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
}
