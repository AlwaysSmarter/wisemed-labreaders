name: wisemed-ai
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wai
      POSTGRES_DB: wai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a random hex secret}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-vector.sql:/docker-entrypoint-initdb.d/010-vector.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U wai -d wai']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build:
      context: ../../..
      dockerfile: apps/wisemed-ai/docker/Dockerfile
    environment:
      WISEMED_AI_DATABASE_URL: postgres://wai:${POSTGRES_PASSWORD}@db:5432/wai?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - '${WISEMED_AI_BIND:-127.0.0.1}:${WISEMED_AI_PORT:-19120}:19120'
    volumes:
      - deployments:/app/deployments
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  postgres:
  deployments:
