analyzer:
    comm_type: file
    protocol: shimatzu-generic
local_http:
    address: 127.0.0.1:18080
    enabled: true
    language: ro
    tls: false
modules:
    app-updates:
        app_id: shimatzu-generic-reader
        auto_download: true
        base_url: http://127.0.0.1:19090
        channel: stable
        download_dir: ./updates
        enabled: true
    help:
        help_dir: ./help
    local-http:
        address: 127.0.0.1:18080
        enabled: true
        language: ro
        repeat_mode: individual
        tls: false
    protocol-shimatzu-generic:
        poll_seconds: 2
        subtype: auto
    qc:
        levels:
            - negativ
            - pozitiv
            - pcrescut
            - pscazut
            - nivel1
            - nivel2
            - nivel3
            - nivel4
            - nivel5
    result-sync:
        enabled: true
        interval_minutes: 5
        qc_prefixes:
            - keep_as_lot: false
              prefix: PC
            - keep_as_lot: false
              prefix: PC_
        sample_prefixes: []
        sample_suffixes: []
        separators:
            - '-'
            - _
            - /
    storage-sqlite:
        path: ./shimatzu-generic-v3.db
    transport-file:
        export_dir: ./outbox
        failed_dir: ./failed
        import_dir: ./inbox
        pattern: '*.txt'
        processed_dir: ./processed
    wisemed-api:
        base_url: https://api.wisemed.example
        cfg_wisemed_ip: ldse.wisemed.eu
        cfg_wisemed_key: 27c490bb-c9e4-47aa-bf6d-ebd2a1add35e
        cfg_wisemed_path: /wisemed-api/apiv2
        cfg_wisemed_port: "443"
        cfg_wisemed_protocol: https
reader:
    analyzer_code: shimatzu-generic-v3
    analyzer_name: Shimatzu
    db_name: shimatzu-generic-v3.db
    id: shimatzu-generic-v3
    label: Shimatzu
wisemed_ws:
    enabled: false
    heartbeat_ms: 15000
    reconnect_delay_ms: 5000
    url: wss://wslocal.wisemed.eu/ws
